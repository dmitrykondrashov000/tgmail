plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.2.1'
    implementation 'org.springframework:spring-context:6.1.2'
    implementation 'org.springframework:spring-aop:6.1.2'

    implementation 'org.telegram:telegrambots:6.9.7.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'

    testImplementation 'org.springframework:spring-test:6.1.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ГЛАВНЫЙ КЛАСС — под твой пакет и имя
application {
    mainClass = 'org.example.tgmail.TgMailApplication'
}